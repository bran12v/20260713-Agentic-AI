name: support-api -> ACA

on: # triggers
    pull_request:
        branches: [main]
        paths: ['support-api/**', '.github/workflows/support-api-CICD.yaml']
    push:
        branches: [main]
        paths: ['support-api/**', '.github/workflows/support-api-CICD.yaml']
    workflow_dispatch: # manual deployment

permissions: # OIDC creds to work, otherwise our azure/login will fail
    id-token: write
    contents: read

concurrency:
    group: support-api-CICD-${{ github.ref }}
    cancel-in-progress: true

env:
    IMAGE_REPOSITORY: support-api
    ACR_NAME: ${{ vars.ACR_NAME }}
    RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}
    APP_NAME: ${{ vars.ACA_APP_NAME }}

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: support
                    POSTGRES_PASSWORD: support_ci
                    POSTGRES_DB: support
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U support"
                    --health-interval 10s --health-timeout 5s --health-retries 5

        steps:
            - uses: actions/checkout@v4 # pull the code onto the runner
            - uses: actions/setup-python@v5 # installs python/pip
              with:
                python-version: '3.12'
                cache: pip
            - name: Install
              working-directory: support-api
              run: pip install -e ".[dev]"
            - name: Test
              working-directory: support-api
              env:
                DATABASE_URL: postgresql://support:support_ci@localhost:5432/support
              run: pytest -q

    build-and-push:
        needs: test
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Azure login (OIDC, no secret)
              uses: azure/login@v2
              with:
                client-id: ${{ vars.AZURE_CLIENT_ID }}
                tenant-id: ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            
            - name: ACR login
              run: az acr login --name "$ACR_NAME"

            - uses: docker/setup-buildx-action@v3
            - name: Build and push
              id: push
              uses: docker/build-push-action@v6
              with:
                context: support-api
                file: support-api/docker/Dockerfile
                push: true
                tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

        outputs:
            digest: ${{ steps.push.outputs.digest }}

    deploy:
        needs: build-and-push
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Azure login (OIDC, no secret)
              uses: azure/login@v2
              with:
                client-id: ${{ vars.AZURE_CLIENT_ID }}
                tenant-id: ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            
            - name: Deploy the digest that passed tests
              run: |
                PREVIOUS=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query "properties.template.containers[0].image" -o tsv)
                echo "$PREVIOUS"

                az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" --image "${ACR_NAME}.azurecr.io/${IMAGE_REPOSITORY}@${{needs.build-and-push.outputs.digest}}" --output none

            - name: Wait for the new revision to be healthy
              run: |
                REV=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
                for _ in $(seq 30); do
                    STATE=$(az containerapp revision show -n "$APP_NAME" -g "$RESOURCE_GROUP" --revision "$REV" --query properties.runningState -o tsv)
                    [ "$STATE" = Running ] && exit 0
                    sleep 10
                done
                echo "$REV FAILURED"
                exit 1